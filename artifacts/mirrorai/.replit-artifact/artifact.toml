kind = "web"
previewPath = "/"
title = "MirrorAI Arabic PWA"
description = "An Arabic right-to-left personal style memory app that imports WhatsApp chat archives, builds a local style profile, and supports context-aware AI analysis while keeping raw messages on the device."
version = "1.0.0"
id = "artifacts/mirrorai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21503

[services.development]
run = "pnpm --filter @workspace/mirrorai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mirrorai", "run", "build" ]
serve = "static"
publicDir = "artifacts/mirrorai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21503"
BASE_PATH = "/"
